name: Package checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request supersedes its running checks. Every push to
# main is its own group, so no run on main is cancelled or replaced while it
# waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  # pnpm check, split: everything but the UI gate, and the UI gate once per
  # browser, side by side.
  base:
    name: Checks without the UI gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system libraries come with the image of the pinned
    # Playwright release: installing them through apt took up to 20 minutes
    # when the Ubuntu mirror was slow. --ipc=host keeps Chromium from running
    # out of shared memory; --init reaps the browsers' child processes.
    container: &playwright
      image: &image mcr.microsoft.com/playwright:v1.64.1-resolute
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image must carry the browsers of the Playwright in the lockfile.
      - &image-matches
        run: test "$IMAGE" = "mcr.microsoft.com/playwright:v$(node -p "require('playwright/package.json').version")-resolute"
        env:
          IMAGE: *image
      - run: pnpm check:base
  ui:
    name: UI gate (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: *playwright
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - *image-matches
      # Ends before the job's timeout, so a stalled gate still leaves its log.
      - run: pnpm test:ui --browsers="$BROWSER"
        timeout-minutes: 12
        env:
          BROWSER: ${{ matrix.browser }}
  # The ruleset requires this status check: it passes only when every job did.
  packages:
    name: Packages and consumers
    needs: [base, ui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$BASE" = success && test "$UI" = success
        env:
          BASE: ${{ needs.base.result }}
          UI: ${{ needs.ui.result }}
