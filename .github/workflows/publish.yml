name: Publish
# Publishes the three packages for a version tag, only in the public repository.
# The maintainer creates the tag; an `npm` environment can require approval.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance
jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'sempods/sempods-typescript'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No dependency cache in the release job: a cache restored from
          # another workflow run could feed what is packed and published.
          # setup-node v5+ caches automatically unless disabled.
          package-manager-cache: false
          # No registry-url: it writes an .npmrc with a placeholder token that
          # the publisher's anonymous `npm view` would send. npm authenticates
          # `npm publish` through the trusted publisher (OIDC) instead.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm check
      # The tag must name exactly the version every package carries.
      - run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            for (const name of ["client-sdk", "app-sdk", "app-ui"]) {
              const { version } = require(`./packages/${name}/package.json`);
              if (version !== tag) throw new Error(`${name} is ${version}, tag is ${tag}`);
            }'
      # Trusted publishing needs npm 11.5.1 or later; .node-version selects it.
      - run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1))))
              throw new Error(`npm ${process.argv[1]} cannot use trusted publishing`);
          ' "$(npm --version)"
      # pnpm pack resolves workspace:* to the exact version (workspace:~ to the
      # same minor). The script publishes client-sdk, app-sdk, then app-ui and,
      # on a rerun, skips a version that is already on the registry only if its
      # contents equal the packed artifact. There is no npm token: npmjs.com
      # trusts this workflow file in the `npm` environment, per package.
      - run: |
          mkdir -p ../release
          pnpm --filter @sempods/client-sdk pack --pack-destination ../release
          pnpm --filter @sempods/app-sdk pack --pack-destination ../release
          pnpm --filter @sempods/app-ui pack --pack-destination ../release
          node scripts/publish-packages.mjs ../release
