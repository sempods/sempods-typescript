name: DCO
# Every pull-request commit needs a Signed-off-by matching its author. The
# check is shared by all sempods repositories and tested there:
# https://github.com/sempods/.github/tree/main/actions/dco
# Keep the job id `check`; the ruleset requires that status check.
on:
  pull_request:
  # The merge queue needs the check on its merge group too. Its commits are
  # GitHub's merges of commits this check passed on the pull request, so the
  # job is skipped there, and a job skipped by its condition reports success.
  merge_group:
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: sempods/.github/actions/dco@16a553a065432a0235ff8f4b78d14ce41062e712 # v1.0.1
