# Version updates. Security updates are enabled in the repository settings.
# Minor and patch bumps arrive as one weekly group per ecosystem; majors stay
# separate, because each deserves its own review.
version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Node types follow the minimum supported runtime (engines: node >=24.15;
      # @types/node 24.13 is the newest release not ahead of it), so newer Node
      # APIs cannot slip in. Raise them together with `engines`/.node-version.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # Playwright 1.65 counts a modal <dialog> under an [inert] ancestor as
      # inert, contrary to the HTML spec, and cannot click the SDK's questions
      # (#264). Lift this once a release handles that exception.
      - dependency-name: 'playwright'
        versions:
          - '>= 1.65.0'

  # The pinned `uses:` SHAs in the workflows are supply-chain dependencies too.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Our own reviewed releases (the shared DCO check) need no waiting period;
    # third-party actions keep Dependabot's default three-day cooldown.
    cooldown:
      exclude:
        - 'sempods/.github/*'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
